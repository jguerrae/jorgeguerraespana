    const ITER = 300000;

    const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

    document.getElementById("unlock-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      const pw = document.getElementById("pw").value;
      if (!pw) return;
      msg.textContent = "Decrypting…";
      try {
        const base = await crypto.subtle.importKey(
          "raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        const plain = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64(IV) }, key, b64(DATA));
        const content = document.getElementById("content");
        content.innerHTML = new TextDecoder().decode(plain);
        content.hidden = false;
        document.getElementById("gate").hidden = true;
      } catch (err) {
        msg.textContent = "Wrong passphrase.";
        document.getElementById("pw").select();
      }
